services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: macro
      POSTGRES_USER: macro
      POSTGRES_PASSWORD: ${MACRO_DB_PASSWORD:?Set MACRO_DB_PASSWORD in your shell or local .env}
    volumes:
      - macro-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macro -d macro"]
      interval: 5s
      timeout: 5s
      retries: 10
  macro-api:
    build: ./apps/macro-api
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: macro
      PGPASSWORD: ${MACRO_DB_PASSWORD:?Set MACRO_DB_PASSWORD}
      PGDATABASE: macro
      PGSSLMODE: disable
      FRED_API_KEY: ${FRED_API_KEY:-}
      INGEST_SCHEDULE: ${INGEST_SCHEDULE:-}
      DXY_FEED_URL: ${DXY_FEED_URL:-}
      DXY_FEED_TOKEN: ${DXY_FEED_TOKEN:-}
      PMI_RELEASE_INDEX_URL: ${PMI_RELEASE_INDEX_URL:-}
      PMI_RELEASE_URLS: ${PMI_RELEASE_URLS:-}
      SBV_BILLS_URL: ${SBV_BILLS_URL:-}
      INGEST_INTERVAL: 6h
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  macro-postgres:
