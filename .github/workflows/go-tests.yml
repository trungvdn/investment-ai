name: Go Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/stock-analysis/**"
      - ".github/workflows/go-tests.yml"
  push:
    branches:
      - main
    paths:
      - "apps/stock-analysis/**"
      - ".github/workflows/go-tests.yml"

permissions:
  contents: write

concurrency:
  group: go-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test stock-analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/stock-analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/stock-analysis/go.mod

      - name: Apply gofmt and commit formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          gofmt -w .
          if ! git diff --quiet -- '*.go'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.go'
            git commit -m "style: format Go files"
            git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
          fi

      - name: Verify formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following Go files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Run static analysis
        run: go vet ./...
