name: Go Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/stock-analysis/**"
      - ".github/workflows/go-tests.yml"
  push:
    branches:
      - main
    paths:
      - "apps/stock-analysis/**"
      - ".github/workflows/go-tests.yml"

permissions:
  contents: write

concurrency:
  group: go-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test stock-analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/stock-analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/stock-analysis/go.mod

      - name: Apply gofmt and commit formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          gofmt -w .
          if ! git diff --quiet -- '*.go'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.go'
            git commit -m "style: format Go files"
            git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
          fi

      - name: Verify formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following Go files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Verify lifecycle examples
        run: go test ./internal/wyckoff -run 'TestLifecycle|TestSpringRecovery|TestPresentation|TestContextFirst' -count=1 -v

      - name: Run static analysis
        run: go vet ./...

      - name: Benchmark reviewed labels with identical structure-scoped evaluators
        env:
          BASELINE_REF: 263e389c1c9d83a4d2f6354aeaf2bee44d154bb7
        run: |
          WYCKOFF_SCOPED_OUTPUT=/tmp/wyckoff-scoped-after.json WYCKOFF_BENCHMARK_OUTPUT=/tmp/wyckoff-after.json go test ./internal/wyckoff -run 'TestReviewedAnnotationBenchmark|TestStructureScopedBenchmark' -count=1 -v
          baseline_dir=$(mktemp -d)
          git -C ../.. archive "$BASELINE_REF" apps/stock-analysis | tar -x -C "$baseline_dir"
          baseline_module="$baseline_dir/apps/stock-analysis"
          cp -a data/annotations/. "$baseline_module/data/annotations/"
          cp internal/wyckoff/annotation_benchmark_test.go internal/wyckoff/scoped_benchmark_test.go "$baseline_module/internal/wyckoff/"
          (cd "$baseline_module" && WYCKOFF_SCOPED_OUTPUT=/tmp/wyckoff-scoped-before.json WYCKOFF_BENCHMARK_OUTPUT=/tmp/wyckoff-before.json go test ./internal/wyckoff -run 'TestReviewedAnnotationBenchmark|TestStructureScopedBenchmark' -count=1 -v)
          python3 scripts/compare_benchmark.py /tmp/wyckoff-before.json /tmp/wyckoff-after.json /tmp/wyckoff-benchmark.md
          cat /tmp/wyckoff-benchmark.md >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/wyckoff-benchmark.md
          python3 scripts/scoped_benchmark_report.py /tmp/wyckoff-scoped-before.json /tmp/wyckoff-scoped-after.json /tmp/wyckoff-scoped-benchmark.md
          cat /tmp/wyckoff-scoped-benchmark.md >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/wyckoff-scoped-benchmark.md

      - uses: actions/upload-artifact@v4
        with:
          name: wyckoff-reviewed-benchmark
          path: |
            /tmp/wyckoff-*.json
            /tmp/wyckoff-*.md
