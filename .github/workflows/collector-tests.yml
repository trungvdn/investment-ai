name: Macro Collector Tests
on:
  pull_request:
    paths:
      - "apps/macro-collectors/**"
      - "docker-compose.collectors.yml"
      - "docker-compose.pilot.yml"
      - "docker-compose.history.yml"
      - "apps/macro-api/migrations/**"
      - "apps/macro-api/cmd/sdmx-replay/**"
      - ".github/workflows/collector-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/macro-collectors/**"
      - "docker-compose.collectors.yml"
      - "docker-compose.pilot.yml"
      - "docker-compose.history.yml"
      - "apps/macro-api/migrations/**"
      - "apps/macro-api/cmd/sdmx-replay/**"
      - ".github/workflows/collector-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: macro_test
          POSTGRES_USER: macro
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U macro -d macro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MACRO_TEST_DATABASE_URL: postgres://macro:ci-test-only@localhost:5432/macro_test?sslmode=disable
      SDMX_REPLAY_BIN: /tmp/sdmx-replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/macro-api/go.mod
          cache-dependency-path: apps/macro-api/go.sum
      - run: go build -o /tmp/sdmx-replay ./cmd/sdmx-replay
        working-directory: apps/macro-api
      - run: pip install -r requirements.txt
        working-directory: apps/macro-collectors
      - run: python -m unittest discover -s tests -v
        working-directory: apps/macro-collectors
      - name: Inspect published NHNN month addresses
        continue-on-error: true
        working-directory: apps/macro-collectors
        run: |
          python - <<'PY'
          from macro_collectors.http import HTTPClient
          from macro_collectors.cpi_reports import ArticleHTML, fold
          from urllib.parse import urlencode
          import json,re,time
          identity='com_liferay_asset_publisher_web_portlet_AssetPublisherPortlet_INSTANCE_lzzn'
          url='https://sbv.gov.vn/vi/thong-cao-bao-chi?'+urlencode({'p_p_id':identity,'p_p_lifecycle':0,'p_p_state':'normal','p_p_mode':'view','_'+identity+'_cur':1,'_'+identity+'_delta':100})
          raw=HTTPClient(deadline=90).get(url)
          parser=ArticleHTML();parser.feed(raw.decode('utf-8'))
          print('NHNN_DISCOVERY '+json.dumps([(href,label) for href,label in parser.links if 'dien bien lai suat' in fold(label) and '2026' in label],ensure_ascii=False))
          PY
      - name: Validate collector deployment configuration
        run: |
          docker compose -f docker-compose.macro.yml -f docker-compose.collectors.yml config --quiet
          docker compose -f docker-compose.macro.yml -f docker-compose.pilot.yml config --quiet
          docker compose -f docker-compose.macro.yml -f docker-compose.history.yml config --quiet
        env:
          MACRO_DB_PASSWORD: ci-test-only
      - name: Build and smoke-test collector runtime
        run: |
          docker build -t investment-ai-collectors:test apps/macro-collectors
          docker run --rm --entrypoint sh investment-ai-collectors:test -c 'test -w /collector-data && command -v pdftotext && python -m macro_collectors --help && python -m macro_collectors.sources inventory --indicator VN_CPI_YOY >/dev/null && python -m macro_collectors.sources --help && python -m macro_collectors.history --help'
