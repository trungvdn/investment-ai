name: Dashboard Tests
on:
  pull_request:
    paths:
      - "apps/macro-dashboard/**"
      - ".github/workflows/dashboard-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/macro-dashboard/**"
      - ".github/workflows/dashboard-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test apps/macro-dashboard/test/*.test.js
