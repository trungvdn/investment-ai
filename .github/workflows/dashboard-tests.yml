name: Dashboard Tests
on:
  pull_request:
    paths:
      - "apps/macro-dashboard/**"
      - "package.json"
      - ".github/workflows/dashboard-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/macro-dashboard/**"
      - "package.json"
      - ".github/workflows/dashboard-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/macro-dashboard/package-lock.json
      - run: npm ci --prefix apps/macro-dashboard
      - run: npm test
      - run: npm run build
